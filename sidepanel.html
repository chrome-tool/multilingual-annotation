<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多言語リアルタイム注釈</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>

  <body>
    <!-- ===== 設定画面 ===== -->
    <div id="screen-settings" class="screen active">
      <div class="settings-header">
        <h1 id="appHeading"></h1>
        <div class="settings-common">
          <div class="settings-common-row">
            <div class="settings-common-field">
              <div class="field-label" data-i18n="langLabel">言語</div>
              <select id="lang" class="setting-select">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="zh">中文（简体）</option>
              </select>
            </div>
            <div class="settings-common-field">
              <div class="field-label" data-i18n="themeLabel">テーマ</div>
              <select id="theme" class="setting-select">
                <option value="auto" data-i18n="themeAuto">自動</option>
                <option value="dark" data-i18n="themeDark">ダーク</option>
                <option value="light" data-i18n="themeLight">ライト</option>
              </select>
            </div>
          </div>

          <div class="divider" style="margin: 12px 0 8px"></div>

          <div
            class="section-label"
            style="margin-top: 0"
            id="labelReadAloud"
          ></div>
          <div class="settings-common-row">
            <div class="settings-common-field">
              <div class="field-label" data-i18n="speechLangLabel">言語</div>
              <select id="speechLang" class="setting-select">
                <option value="auto" data-i18n="speechLangAuto">
                  自動（UI言語）
                </option>
                <option value="ja-JP">日本語</option>
                <option value="en-US">English</option>
                <option value="zh-CN">中文（簡体）</option>
                <option value="zh-TW">中文（繁体）</option>
                <option value="ko-KR">한국어</option>
                <option value="es-ES">Español</option>
                <option value="fr-FR">Français</option>
                <option value="de-DE">Deutsch</option>
              </select>
            </div>
            <div class="settings-common-field">
              <div class="field-label" data-i18n="speechRateLabel">速さ</div>
              <div style="display: flex; align-items: center; gap: 6px">
                <input
                  type="range"
                  id="speechRate"
                  min="0.5"
                  max="2"
                  step="0.25"
                  style="flex: 1; margin-top: 0"
                />
                <span class="slider-value" id="speechRateValue">1.0×</span>
              </div>
            </div>
          </div>

          <div class="divider" style="margin: 12px 0 8px"></div>

          <div
            class="section-label"
            style="margin-top: 0"
            id="labelAiProvider"
          ></div>
          <label class="provider-card" id="card-builtin">
            <input type="radio" name="aiProvider" value="builtin" />
            <span class="provider-title" data-i18n="providerBuiltin"
              >Chrome 内蔵 AI（無料・ローカル推論）</span
            >
          </label>
          <label class="provider-card" id="card-external">
            <input type="radio" name="aiProvider" value="external" />
            <span class="provider-title" data-i18n="providerExternal"
              >外部 API（OpenAI / Ollama など）</span
            >
          </label>
          <div id="externalSettings" style="display: none">
            <div class="field-label" data-i18n="presetLabel">プリセット</div>
            <select id="apiPreset" class="setting-select">
              <option value="ollama">Ollama (localhost:11434)</option>
              <option value="lmstudio">LM Studio (localhost:1234)</option>
              <option value="jan">Jan (localhost:1337)</option>
              <option value="openai">OpenAI (gpt-4o-mini)</option>
              <option value="openai-o4mini">OpenAI o4-mini (reasoning)</option>
              <option value="openai-o3">OpenAI o3 (reasoning)</option>
              <option value="groq">Groq</option>
              <option value="custom" data-i18n="presetCustom">
                カスタム（手動入力）
              </option>
            </select>
            <div class="field-label" data-i18n="apiEndpointLabel">
              エンドポイント URL
            </div>
            <input
              type="url"
              id="apiEndpoint"
              class="text-input"
              placeholder="https://api.openai.com/v1"
            />
            <div class="field-label" data-i18n="apiKeyLabel">API キー</div>
            <input
              type="password"
              id="apiKey"
              class="text-input"
              placeholder="sk-..."
            />
            <div class="field-label" data-i18n="modelNameLabel">モデル名</div>
            <input
              type="text"
              id="modelName"
              class="text-input"
              placeholder="gpt-4o-mini"
            />
            <div class="api-hint" data-i18n="apiHint"></div>
          </div>
        </div>
      </div>

      <!-- タブバー -->
      <div class="settings-tabs">
        <button
          class="tab-btn active"
          data-tab="annotation"
          id="tabBtnAnnotation"
        ></button>
        <button class="tab-btn" data-tab="chat" id="tabBtnChat"></button>
      </div>

      <!-- 注釈タブ -->
      <div id="tab-annotation" class="tab-panel active">
        <div class="tab-desc" data-i18n="annotationTabDesc">
          ウェブページのテキストを選択または右クリックすると AI
          が解析・翻訳します
        </div>
        <div class="row" style="margin-bottom: 12px">
          <label data-i18n="useExtension">この拡張を使う</label>
          <label class="toggle">
            <input type="checkbox" id="enabled" />
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>
        <div
          class="section-label"
          style="margin-top: 0"
          data-i18n="whenAnnotate"
        >
          いつ注釈を出す？
        </div>
        <label class="mode-card" id="card-hover">
          <input type="radio" name="trigger" value="hover" />
          <div class="mode-title" data-i18n="modeHoverTitle">
            🖱️ マウスを乗せたとき
          </div>
          <div class="mode-desc" data-i18n="modeHoverDesc">
            単語の上にカーソルを置くだけで自動で注釈が出ます。
          </div>
        </label>
        <label class="mode-card" id="card-select">
          <input type="radio" name="trigger" value="select" />
          <div class="mode-title" data-i18n="modeSelectTitle">
            ✏️ 文章を選んだとき
          </div>
          <div class="mode-desc" data-i18n="modeSelectDesc">
            マウスでドラッグして選んだ範囲を注釈します。
          </div>
        </label>
        <label class="mode-card" id="card-contextmenu">
          <input type="radio" name="trigger" value="contextmenu" />
          <div class="mode-title" data-i18n="modeContextTitle">
            🖱️ 右クリックのみ（誤爆なし）
          </div>
          <div class="mode-desc" data-i18n="modeContextDesc">
            自動では出ません。テキストを選んで右クリックして解析します。
          </div>
        </label>
        <div class="mode-hint" data-i18n="modeHint">
          💡 どのモードでも、テキストを選んで右クリックすれば解析できます。
        </div>

        <div class="slider-row" id="delayRow">
          <div class="row">
            <label data-i18n="reactionSpeed">反応までの速さ</label>
            <span class="slider-value" id="delayValue">0.6秒</span>
          </div>
          <input type="range" id="hoverDelay" min="200" max="1500" step="100" />
        </div>

        <div class="divider"></div>

        <div class="vocab-header">
          <div
            class="section-label"
            style="margin: 0"
            id="labelVocabulary"
          ></div>
          <span class="vocab-count" id="vocabCount">0</span>
        </div>
        <div class="vocab-actions" style="margin-top: 8px">
          <button class="mini-btn" id="exportBtn"></button>
          <button class="mini-btn danger" id="clearBtn"></button>
        </div>
        <input type="search" id="vocabSearch" placeholder="単語帳を検索..." />
        <div class="vocab-list" id="vocabList"></div>
        <div style="height: 16px"></div>
      </div>

      <!-- チャットタブ -->
      <div id="tab-chat" class="tab-panel">
        <div class="tab-desc" data-i18n="chatTabDesc">
          AI とリアルタイムで会話できます。会話履歴は自動保存されます
        </div>
        <button id="openChatBtn" class="open-chat-btn">
          <span class="open-chat-icon" id="openChatIcon"></span>
          <div class="open-chat-info">
            <div class="open-chat-label" data-i18n="openChat">
              チャットを開く
            </div>
            <div class="open-chat-sub" data-i18n="chatEmpty">
              何でも話しかけてください
            </div>
          </div>
          <span id="chatBadge" class="chat-badge" style="display: none"></span>
          <span class="chevron">›</span>
        </button>
        <div style="height: 16px"></div>
      </div>
    </div>

    <!-- ===== チャット画面 ===== -->
    <div id="screen-chat" class="screen">
      <div class="chat-nav">
        <button
          class="nav-btn icon-btn"
          id="sidebarToggle"
          title="履歴"
        ></button>
        <button
          class="nav-btn icon-btn"
          id="backBtn"
          title="設定へ戻る"
        ></button>
        <span class="chat-nav-title" id="chatNavTitle"></span>
        <button id="speakStopBtn" title="読み上げを停止"></button>
        <button
          class="nav-btn icon-btn"
          id="favBtn"
          title="お気に入り"
        ></button>
        <button
          class="nav-btn icon-btn"
          id="chatThemeBtn"
          title="テーマ切り替え"
        ></button>
        <button
          class="nav-btn icon-btn"
          id="newChatBtn"
          title="新しい会話"
        ></button>
      </div>

      <div class="chat-body">
        <!-- 左サイドバー（会話履歴リスト） -->
        <div id="chatSidebar" class="chat-sidebar open">
          <div id="sidebarList"></div>
          <!-- フォルダ移動ピッカー（インライン表示） -->
          <div id="folderPicker" class="folder-picker" hidden>
            <div class="folder-picker-title" data-i18n="moveToFolder">
              フォルダへ移動
            </div>
            <div id="folderPickerList"></div>
            <button
              id="folderPickerNone"
              class="folder-picker-item none-item"
              data-i18n="noFolder"
            >
              フォルダなし
            </button>
          </div>
        </div>

        <!-- メインチャットエリア -->
        <div class="chat-main">
          <div class="viewing-banner" id="viewingBanner">
            <span data-i18n="viewingPast">過去の会話を閲覧中</span>
            <button id="exitViewBtn" data-i18n="backToCurrentChat">
              現在へ戻る
            </button>
          </div>

          <!-- お気に入りパネル（オーバーレイ） -->
          <div id="favoritesPanel" class="favorites-panel" hidden>
            <div class="fav-header">
              <span class="fav-title" id="favTitle"></span>
              <div class="fav-header-btns">
                <button
                  class="fav-hdr-btn"
                  id="favSelectBtn"
                  title="選択"
                ></button>
                <button
                  class="fav-hdr-btn danger"
                  id="favClearAllBtn"
                  title="全削除"
                ></button>
                <button class="fav-close-btn" id="favCloseBtn"></button>
              </div>
            </div>
            <div id="favList" class="fav-list"></div>
          </div>

          <div class="scroll-btns">
            <button
              class="scroll-btn"
              id="scrollTopBtn"
              title="先頭へ"
            ></button>
            <button
              class="scroll-btn"
              id="scrollBotBtn"
              title="末尾へ"
            ></button>
          </div>

          <div class="chat-messages" id="chatMessages"></div>

          <div class="chat-footer" id="chatFooter">
            <div
              id="chatAttachPreview"
              class="chat-attach-preview"
              style="display: none"
            ></div>
            <div class="chat-input-row">
              <button
                id="chatMicBtn"
                class="chat-mic-btn"
                title="音声入力"
              ></button>
              <button
                id="chatAttachBtn"
                class="chat-mic-btn"
                title="ファイル添付"
              ></button>
              <button
                id="chatThinkBtn"
                class="chat-mic-btn"
                title="思考モード（Deep Think）"
              ></button>
              <input
                type="file"
                id="chatFileInput"
                accept="image/*,text/*,.pdf,.md,.csv,.json"
                style="display: none"
              />
              <textarea
                id="chatInput"
                rows="1"
                placeholder="メッセージを入力..."
              ></textarea>
              <button id="chatStop" style="display: none"></button>
              <button id="chatSend" class="chat-send-btn"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 確認ダイアログ -->
    <div id="confirmModal" class="confirm-modal" hidden>
      <div class="confirm-box">
        <p id="confirmMsg" class="confirm-msg"></p>
        <div class="confirm-btns">
          <button id="confirmCancel" class="confirm-btn cancel"></button>
          <button id="confirmOk" class="confirm-btn ok"></button>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="llm.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
